name: Build Minecraft Messenger

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build Fabric Mod
runs-on: ubuntu-latest

steps:
- name: Checkout repository
uses: actions/checkout@v4

- name: Set up Java 21
uses: actions/setup-java@v4
with:
distribution: temurin
java-version: '21'
cache: gradle

- name: Set up Gradle
uses: gradle/actions/setup-gradle@v4

- name: Build mod
run: gradle build --no-daemon

- name: Verify compiled mod classes
shell: bash
run: |
set -eu

echo "Checking compiled Java classes..."

test -f build/classes/java/main/com/minecraftmessenger/MinecraftMessengerClient.class
test -f build/classes/java/main/com/minecraftmessenger/FirebaseClient.class
test -f build/classes/java/main/com/minecraftmessenger/FirestoreClient.class
test -f build/classes/java/main/com/minecraftmessenger/LoginScreen.class
test -f build/classes/java/main/com/minecraftmessenger/MessengerScreen.class

echo "All required Java classes were compiled."

- name: Verify JAR contents
shell: bash
run: |
set -eu

JAR_FILE="build/libs/MinecraftMessenger-${GITHUB_REF_NAME}.jar"

echo "Available JAR files:"
find build/libs -maxdepth 1 -type f -name "*.jar" -print

JAR_FILE="$(find build/libs -maxdepth 1 -type f -name '*-remapped.jar' -print -quit)"

if [ -z "$JAR_FILE" ]; then
JAR_FILE="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)"
fi

test -n "$JAR_FILE"
test -f "$JAR_FILE"

echo "Checking: $JAR_FILE"
jar tf "$JAR_FILE" > jar-contents.txt
cat jar-contents.txt

grep -q '^fabric.mod.json$' jar-contents.txt
grep -q 'com/minecraftmessenger/MinecraftMessengerClient.class' jar-contents.txt

echo "JAR contains the Fabric metadata and main mod class."

- name: Upload JAR
uses: actions/upload-artifact@v4
with:
name: MinecraftMessenger-1.21.1
path: build/libs/*.jar
if-no-files-found: error
