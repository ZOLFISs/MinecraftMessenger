plugins {
    id 'fabric-loom' version '1.8.13'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

dependencies {
    minecraft("com.mojang:minecraft:${project.minecraft_version}")

    def yarnGroup = "net.fabricmc"
    def yarnArtifact = "yarn"
    def yarnVersion = "1.21.1+build.3"
    def yarnClassifier = "v2"

    mappings(
        group: yarnGroup,
        name: yarnArtifact,
        version: yarnVersion,
        classifier: yarnClassifier
    )

    modImplementation(
        group: "net.fabricmc",
        name: "fabric-loader",
        version: project.loader_version
    )

    modImplementation(
        group: "net.fabricmc.fabric-api",
        name: "fabric-api",
        version: project.fabric_api_version
    )

    implementation("com.google.code.gson:gson:2.11.0")
    include("com.google.code.gson:gson:2.11.0")
}
